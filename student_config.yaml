# Configuration for training the student model with knowledge distillation

run_name: "DDPM_student_distilled"
epochs: 200
batch_size: 64
image_size: 64
num_classes: 10
dataset_path: "data/cifar10_subset"
device: "cuda"
learning_rate: 3e-4
save_interval: 10

# Knowledge distillation
distillation: true
teacher_path: "models/DDPM_teacher/final_model.pt"
compress: true  # Use compressed student model

# Training options
mixed_precision: true
use_ema: true

# Augmentation and regularization
dropout: 0.0
weight_decay: 1e-4
