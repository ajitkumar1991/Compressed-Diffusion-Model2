# Configuration for training the teacher model

run_name: "DDPM_teacher"
epochs: 200
batch_size: 64
image_size: 64
num_classes: 10
dataset_path: "data/cifar10_subset"
original_dataset_path: "data/cifar10"
device: "cuda"
learning_rate: 3e-4
save_interval: 10
subset_size: 10000

# Training options
mixed_precision: true
use_ema: true
distillation: false
compress: false

# Augmentation and regularization
dropout: 0.0
weight_decay: 1e-4
